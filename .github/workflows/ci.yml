name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests\AppDispatcher.Tests --nologo
      # Publishing is what proves the picker still compiles under Native AOT.
      - name: Publish
        shell: pwsh
        run: .\publish.ps1
