# Pushing a tag such as v0.1.3 builds the release zip here rather than on a developer's PC,
# attests where it came from, and creates a draft release to review before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props" }

      - name: Test
        run: dotnet test tests\AppDispatcher.Tests --nologo

      - name: Package
        id: package
        shell: pwsh
        run: |
          .\package.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Get-ChildItem artifacts\AppDispatcher-*-win-x64.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          NAME: ${{ steps.package.outputs.name }}
          HASH: ${{ steps.package.outputs.hash }}
        run: |
          $notes = @"
          ## Verify the download

          SHA-256 of ``$env:NAME``:

          ``````
          $env:HASH
          ``````

          In PowerShell: ``(Get-FileHash .\$env:NAME).Hash``

          This zip was built by GitHub Actions from this tag. To confirm that with the [GitHub CLI](https://cli.github.com/):

          ``````
          gh attestation verify $env:NAME --repo $env:GITHUB_REPOSITORY
          ``````
          "@
          gh release create $env:GITHUB_REF_NAME $env:ZIP --draft --title "App Dispatcher $env:GITHUB_REF_NAME" --notes $notes
